# Weekly dependency updates. Android Lint's own version checks are disabled in favour of these PRs.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /android/tools/theme
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
