# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
build:
  maxIssues: 0

naming:
  FunctionNaming:
    # Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose-style private top-level values (e.g. private val DefaultCenter).
    privatePropertyPattern: '[A-Za-z][_A-Za-z0-9]*'
  EnumNaming:
    enumEntryPattern: '[A-Z][A-Za-z0-9]*'

complexity:
  TooManyFunctions:
    # Implementations are as long as the interface they implement, and those mirror the API
    # (one function per endpoint): splitting them would only hide the size of the API.
    ignoreOverridden: true
    thresholdInInterfaces: 20
    # A ViewModel has one function per user action, and a form has many of them.
    thresholdInClasses: 15
    # A Hilt module has one provider per API.
    thresholdInObjects: 20
    # A DAO has one function per SQL statement.
    ignoreAnnotated: ['Dao']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/theme/ColorSchemes.kt']
    # Previews show sample data.
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'PreviewFontScale', 'PreviewScreenSizes']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewLightDark', 'PreviewFontScale', 'PreviewScreenSizes']
  MaxLineLength:
    maxLineLength: 120
  ForbiddenComment:
    # No empty TODOs in delivered code; pending work goes to the backlog.
    comments: ['TODO:', 'FIXME:', 'STOPSHIP:']
