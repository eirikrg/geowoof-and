# Defaults for the Secrets Gradle Plugin, used when android/secrets.properties does not exist.
# Real values go in secrets.properties (git-ignored). See docs/setup.md.
MAPS_API_KEY=DEFAULT_API_KEY
# Backend seen from the Android emulator (10.0.2.2 is the host machine).
API_BASE_URL=http://10.0.2.2:8080/
# Web OAuth client ID for Sign in with Google. Empty: the Google button is hidden.
GOOGLE_SERVER_CLIENT_ID=
